plugins {
	id "net.fabricmc.fabric-loom" version "1.15.+"
	id "maven-publish"
}
base {
	archivesName = project.archives_base_name
}
version = project.mod_version
group = project.maven_group

repositories {
	maven {
		name = "Fabric"
		url = "https://maven.fabricmc.net/"
	}
	maven {
		name = "Nucleoid"
		url = "https://maven.nucleoid.xyz/"
	}

	maven {
		name "lenni0451Maven"
		url "https://maven.lenni0451.net/snapshots"
	}
	mavenCentral()
}

dependencies {
	// Main
	minecraft("com.mojang:minecraft:${project.minecraft_version}")
	implementation("net.fabricmc:fabric-loader:${project.loader_version}")

	// Fabric API
	implementation("net.fabricmc.fabric-api:fabric-api:${project.fabric_version}")

	// Plasmid
	implementation("xyz.nucleoid:plasmid:${project.plasmid_version}")
	implementation include("eu.pb4:polymer-core:0.18.2+26.3")
	implementation include("eu.pb4:polymer-resource-pack:0.18.2+26.3")
	implementation include("eu.pb4:polymer-resource-pack-extras:0.18.2+26.3")
	implementation include("eu.pb4:polymer-virtual-entity:0.18.2+26.3")
	implementation include("eu.pb4:polymer-sound-patcher:0.18.2+26.3")
	implementation include("eu.pb4:polymer-autohost:0.18.2+26.3")
	//implementation("eu.pb4:polymer-resource-pack-extras:0.11.8+1.21.4")

	implementation include("net.raphimc:NoteBlockLib:3.3.0")
	implementation include("com.shinyhut:vernacular:1.14")
	//implementation include('org.gagravarr:vorbis-java-core:0.8')
}

processResources {
	inputs.property "version", project.version

	filesMatching("fabric.mod.json") {
		expand "version": project.version
	}
}

java {
	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

tasks.withType(JavaCompile) {
	options.release = 25
	options.encoding = "UTF-8"
}

jar {
	from "LICENSE"
	from("jars/mochadoom.jar") {
		into("jars/")
	}
	from("doomwrapper/build/libs/doomwrapper.jar") {
		into("jars/")
	}
}
