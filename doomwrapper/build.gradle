plugins {
	id "net.fabricmc.fabric-loom" version "1.15.+"
}

base {
	archivesName = 'doomwrapper'
}

group = project.maven_group

repositories {
	maven {
		name = "Fabric"
		url = "https://maven.fabricmc.net/"
	}
	maven {
		name = "Nucleoid"
		url = "https://maven.nucleoid.xyz/"
	}

	maven {
		name "lenni0451Maven"
		url "https://maven.lenni0451.net/snapshots"
	}
	mavenCentral()
}

dependencies {
	// Main
	minecraft("com.mojang:minecraft:${project.minecraft_version}")
	compileOnly("net.fabricmc:fabric-loader:${project.loader_version}")

	// Fabric API
	compileOnly("net.fabricmc.fabric-api:fabric-api:${project.fabric_version}")

	compileOnly "net.raphimc:NoteBlockLib:3.3.0"
	compileOnly "eu.pb4:map-canvas-api:0.9.1+26.2"
	compileOnly files('../jars/mochadoom.jar')
	compileOnly project(':')

}

processResources {
	inputs.property "version", project.version

	filesMatching("fabric.mod.json") {
		expand "version": project.version
	}
}

java {
	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

tasks.withType(JavaCompile) {
	options.release = 25
	options.encoding = "UTF-8"
}

jar {
	from "LICENSE"
}
